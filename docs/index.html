function base64url_encode(inp)
{
    return btoa(inp).replace(/\+/g, "-").replace(/\//g, "_");
};

function str_arrbuf(inp)
{
    return new Uint8Array(inp.split("").map(function(i)
    {
        return i.charCodeAt(0);
    }));
};

function arrbuf_str(inp)
{
    const inpview = new DataView(inp);
    let out = "";
    for (let i = 0; i < inp.byteLength; i++)
    {
        out += String.fromCharCode(inpview.getUint8(i));
    }
    return out;
};

async function token_header()
{
    return "Bearer " + await get_token();
}

async function display_views()
{
    const req =
    {
        dateRanges:
        [{
            startDate: "2022-01-01",
            endDate: "today"
        }],
        dimensions:
        [{
            name: "pagePath"
        }],
        metrics:
        [{
            name: "screenPageViews"
        }],
        metricAggregations: ["TOTAL"]
    };
    await $.ajax
    ({
        url: "https://analyticsdata.googleapis.com/v1beta/properties/319337838:runReport",
        method: "POST",
        headers:
        {
            Authorization: await token_header()
        },
        contentType: "application/json",
        data: JSON.stringify(req),
        dataType: "json",
        success: response =>
        {
            const t = response.totals[0];
            $(".views").text(t.metricValues[t.dimensionValues.findIndex(e => e.value == "RESERVED_TOTAL")].value);
        },
        error: error =>
        {
            alert("錯誤：" + JSON.stringify(error));
        }
    });
}

                element1 = $(prefix + "1");

                return element1.length == 1 && element2.length == 1;
            };
        while (get_elements())
        {
            element2.css("margin-top", element1.outerHeight(true).toString() + "px");
            index++;
        }
        $("a").filter(function(index)
            {
                return $(this).prop("href") === "<data:blog.url/>";
            }).addClass("unavailable");
    }
);
